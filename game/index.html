<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BRAWLER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 18%, #14181f 0%, #0a0a0c 60%);
    color: #cfd2d6; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  h1 {
    margin: 0; font-size: clamp(40px, 12vw, 110px); letter-spacing: .14em; font-weight: 800;
    color: #54e0c8; text-shadow: 0 0 30px rgba(84,224,200,.35); line-height: 1;
  }
  .tag { color: #5a5f66; letter-spacing: .42em; font-size: 12px; margin-bottom: 40px; text-transform: uppercase; }
  a.play {
    display: inline-block; text-decoration: none; font: inherit; font-size: 18px; letter-spacing: .18em;
    color: #0a0a0c; background: #54e0c8; padding: 16px 54px; border-radius: 8px; font-weight: 700;
    box-shadow: 0 0 40px -8px rgba(84,224,200,.6); transition: transform .1s, box-shadow .2s;
  }
  a.play:hover { transform: translateY(-2px); box-shadow: 0 0 60px -6px rgba(84,224,200,.8); }
  a.play:active { transform: translateY(0); }
  .admin { position: fixed; bottom: 14px; right: 16px; }
  .admin a { color: #3a4049; font-size: 11px; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
  .admin a:hover { color: #6a7078; }
</style>
</head>
<body>
<div id="title">
  <h1>BRAWLER</h1>
  <div class="tag">pixel arena fighter</div>
  <a class="play" id="play" href="./select.html">PLAY</a>
</div>
<div class="admin"><a href="./admin.html">admin</a></div>
<script>
  // carry a ?room= deep-link straight through to character select
  const room = new URLSearchParams(location.search).get("room");
  if (room) document.getElementById("play").href = "./select.html?room=" + encodeURIComponent(room);
</script>
</body>
</html>
