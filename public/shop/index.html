<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Monobloc</title>
  <meta name="description" content="Monobloc merch — tees, tapes, and stickers.">
  <meta property="og:title" content="Shop — Monobloc">
  <meta property="og:description" content="Monobloc merch — tees, tapes, and stickers.">
  <meta property="og:image" content="/assets/logo-nav.png">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/assets/styles.css?v=44">
</head>
<body>
  <div class="crt-overlay crt-overlay--scanlines" aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--flicker"   aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--vignette"  aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--glow"      aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--curve"     aria-hidden="true"></div>

  <header class="navbar" role="banner">
    <a class="navbar__logo" href="/" aria-label="Monobloc home">
      <img src="/assets/logo-nav.png" alt="Monobloc" width="699" height="200">
    </a>
    <nav class="navbar__links" aria-label="Primary">
      <a class="btn-ghost" href="/live/">Live</a>
      <a class="btn-ghost" href="/media/">Media</a>
      <a class="btn-ghost" href="/shop/" aria-current="page">Shop</a>
      <a class="btn-ghost" href="/demos/">Demos</a>
    </nav>
  </header>

  <main>
    <div class="section-title">
      <div class="section-title__row">
        <span class="section-title__spacer" aria-hidden="true">EFSA</span>
        <h1 class="section-title__main">Shop</h1>
        <span class="section-title__spacer" aria-hidden="true">ASFE</span>
      </div>
      <p class="section-title__sub">Tape hiss sold separately.</p>
    </div>

    <!--
      STRIPE SETUP
      ============
      Each product below links to a Stripe Payment Link. To wire up real checkout:

      1. In your Stripe Dashboard: Products → Add product → set name + price.
      2. Product → "Create payment link" → copy the URL (looks like
         https://buy.stripe.com/test_XXXX for test mode,
         https://buy.stripe.com/XXXX for live).
      3. Replace the placeholder href="#stripe-..." values below.
      4. Optionally set "after-payment" behavior in Stripe to redirect back to
         /shop/ or a /thanks/ page you add later.
    -->

    <section class="shop-grid" aria-label="Products">

      <!-- ===== Product 1: Tee ===== -->
      <article class="product">
        <div class="product__media" aria-hidden="true">
          <!-- T-shirt outline -->
          <svg viewBox="0 0 160 160" role="img" aria-label="T-shirt">
            <path d="M40 30 L60 20 Q80 35 100 20 L120 30 L140 50 L120 65 L115 55 L115 140 L45 140 L45 55 L40 65 L20 50 Z"
                  stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="product__title">Monobloc Tee</h2>
        <p class="product__price">$35</p>
        <a class="btn-ghost product__buy"
           href="#stripe-tee"
           data-product="tee">Buy</a>
      </article>

      <!-- ===== Product 2: Cassette ===== -->
      <article class="product">
        <div class="product__media" aria-hidden="true">
          <!-- Cassette tape outline -->
          <svg viewBox="0 0 160 110" role="img" aria-label="Cassette tape">
            <rect x="8" y="8" width="144" height="94" rx="6"/>
            <rect x="20" y="28" width="120" height="38" rx="2"/>
            <circle cx="56" cy="47" r="10"/>
            <circle cx="104" cy="47" r="10"/>
            <path d="M30 86 L50 86 M110 86 L130 86"/>
          </svg>
        </div>
        <h2 class="product__title">Test Pattern Cassette</h2>
        <p class="product__price">$20</p>
        <a class="btn-ghost product__buy"
           href="#stripe-cassette"
           data-product="cassette">Buy</a>
      </article>

      <!-- ===== Product 3: Sticker pack ===== -->
      <article class="product">
        <div class="product__media" aria-hidden="true">
          <!-- Stacked stickers -->
          <svg viewBox="0 0 160 160" role="img" aria-label="Sticker pack">
            <rect x="30" y="30" width="90" height="90" rx="6" transform="rotate(-6 75 75)"/>
            <rect x="38" y="38" width="90" height="90" rx="6" transform="rotate(4 83 83)"/>
            <rect x="46" y="46" width="90" height="90" rx="6"/>
            <circle cx="91" cy="91" r="8"/>
          </svg>
        </div>
        <h2 class="product__title">CRT Sticker Pack</h2>
        <p class="product__price">$10</p>
        <a class="btn-ghost product__buy"
           href="#stripe-stickers"
           data-product="stickers">Buy</a>
      </article>

    </section>
  </main>
  <script src="/assets/keynav.js?v=44" defer></script>
</body>
</html>
