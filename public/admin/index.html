<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Monobloc</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/styles.css?v=44">
</head>
<body>
  <div class="crt-overlay crt-overlay--scanlines" aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--flicker"   aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--vignette"  aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--glow"      aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--curve"     aria-hidden="true"></div>

  <header class="navbar" role="banner">
    <a class="navbar__logo" href="/" aria-label="Monobloc home">
      <img src="/assets/logo-nav.png" alt="Monobloc" width="699" height="200">
    </a>
    <nav class="navbar__links" aria-label="Primary">
      <a class="btn-ghost" href="/demos/">Demos</a>
    </nav>
  </header>

  <main class="admin">
    <!-- Login -->
    <section class="admin__login" id="adminLogin">
      <h1 class="admin__title">demos admin</h1>
      <form id="loginForm" class="admin__login-form">
        <input type="password" id="adminPass" class="admin__input" placeholder="admin password"
          autocomplete="current-password" aria-label="Admin password">
        <button type="submit" class="admin__btn">enter</button>
      </form>
      <p class="admin__msg" id="loginMsg" role="status" aria-live="polite"></p>
    </section>

    <!-- Console (hidden until authed) -->
    <section class="admin__console" id="adminConsole" hidden>
      <div class="admin__bar">
        <h1 class="admin__title">demos admin</h1>
        <button class="btn-ghost" id="logoutBtn" type="button">log out</button>
      </div>

      <!-- Tracks -->
      <div class="admin__panel">
        <h2 class="admin__h2">tracks</h2>
        <ol class="admin__tracks" id="adminTracks"></ol>

        <h3 class="admin__h3" id="trackFormHead">add a track</h3>
        <form id="trackForm" class="admin__form">
          <input type="hidden" id="tfId">
          <label class="admin__label">title
            <input type="text" id="tfTitle" class="admin__input" maxlength="200" required>
          </label>
          <label class="admin__label">description
            <textarea id="tfDesc" class="admin__input" rows="3" maxlength="4000"></textarea>
          </label>
          <div class="admin__upload">
            <p class="admin__note">upload a video file (mp4 / webm / mov, up to 1&nbsp;GB):</p>
            <div class="admin__upload-row">
              <input type="file" id="tfVideoFile" class="admin__file" accept="video/mp4,video/webm,video/quicktime,video/ogg">
              <button type="button" class="admin__btn" id="tfUploadBtn">upload video</button>
            </div>
            <p class="admin__msg" id="uploadMsg" role="status" aria-live="polite"></p>
          </div>
          <label class="admin__label">hosted video URL (auto-filled after upload — or paste a direct file URL)
            <input type="text" id="tfSrc" class="admin__input" maxlength="800">
          </label>
          <div class="admin__upload">
            <p class="admin__note">upload the song — audio player + download (mp4 / wav / mp3, up to 1&nbsp;GB):</p>
            <div class="admin__upload-row">
              <input type="file" id="tfAudioFile" class="admin__file" accept="audio/*,video/mp4,.mp4,.wav,.mp3,.m4a">
              <button type="button" class="admin__btn" id="tfUploadAudioBtn">upload song</button>
            </div>
            <p class="admin__msg" id="audioMsg" role="status" aria-live="polite"></p>
          </div>
          <label class="admin__label">hosted song URL (auto-filled after upload — or paste a direct file URL)
            <input type="text" id="tfAudio" class="admin__input" maxlength="800">
          </label>
          <label class="admin__label">poster image (optional, for self-hosted)
            <input type="text" id="tfPoster" class="admin__input" maxlength="500">
          </label>
          <div class="admin__form-actions">
            <button type="submit" class="admin__btn" id="tfSave">save track</button>
            <button type="button" class="btn-ghost" id="tfCancel" hidden>cancel edit</button>
          </div>
          <p class="admin__msg" id="trackMsg" role="status" aria-live="polite"></p>
        </form>
      </div>

    </section>
  </main>

  <script src="/assets/keynav.js?v=44" defer></script>
  <script src="/assets/admin.js?v=44" defer></script>
</body>
</html>
