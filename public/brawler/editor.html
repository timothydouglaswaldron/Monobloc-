<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAWLER — map editor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0a0a0c; color: #cfd2d6;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid #1c1f24; flex: 0 0 auto;
  }
  #bar .title { color: #54e0c8; font-weight: 700; letter-spacing: .14em; font-size: 12px; }
  #bar .spacer { flex: 1; }
  #bar input {
    background: #121519; border: 1px solid #2a2f36; color: #cfd2d6;
    border-radius: 5px; padding: 5px 8px; font: inherit; font-size: 12px; width: 120px;
  }
  #bar .dim { color: #5a5f66; font-size: 11px; }
  button {
    background: #15191e; border: 1px solid #2a2f36; color: #cfd2d6;
    border-radius: 5px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: #3a4049; background: #1b2026; }
  button.go { border-color: #2f6b60; color: #54e0c8; }

  #main { display: flex; flex: 1; min-height: 0; }

  #side {
    width: 168px; flex: 0 0 auto; border-right: 1px solid #1c1f24;
    padding: 12px 10px; overflow-y: auto;
  }
  #side h4 {
    margin: 14px 0 7px; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: #5a5f66; font-weight: 600;
  }
  #side h4:first-child { margin-top: 0; }
  .tool {
    display: flex; align-items: center; gap: 8px; width: 100%;
    margin-bottom: 5px; text-align: left;
  }
  .tool.sel { border-color: #54e0c8; color: #fff; background: #16201e; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }

  #stage { flex: 1; position: relative; min-width: 0; background: #0a0a0c; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #help {
    position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #4a4f57;
    letter-spacing: .06em; pointer-events: none;
  }
  #status {
    position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: #6a7078;
    pointer-events: none;
  }
</style>
  <script type="module" crossorigin src="/brawler/assets/editor-DErdzWpK.js"></script>
  <link rel="modulepreload" crossorigin href="/brawler/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/brawler/assets/stage-Ce6bXp3x.js">
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="title">MAP EDITOR</span>
    <input id="name" title="map name" />
    <span class="dim" id="size"></span>
    <span class="spacer"></span>
    <button id="new">New</button>
    <button id="open">Open</button>
    <button id="save">Save</button>
    <button id="play" class="go">Play &rsaquo;</button>
  </div>
  <div id="main">
    <div id="side">
      <h4>Paint</h4>
      <div id="paints"></div>
      <h4>Stamps</h4>
      <div id="stamps"></div>
    </div>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="help">left: paint/place &middot; right: erase &middot; space+drag or middle: pan &middot; wheel: zoom</div>
      <div id="status"></div>
    </div>
  </div>
</div>
</body>
</html>
