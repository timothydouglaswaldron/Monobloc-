<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monobloc.online</title>
  <meta name="description" content="Monobloc — shows, media, merch.">
  <meta property="og:title" content="Monobloc.online">
  <meta property="og:description" content="Monobloc — shows, media, merch.">
  <meta property="og:image" content="/assets/logo-transparent.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="/assets/logo-transparent.png">
  <link rel="stylesheet" href="/assets/styles.css?v=44">
  <style>
    /* Homepage-specific: brighter CRT bg + full-viewport stage + logo flicker */
    html, body { background: var(--bg-crt); overflow: hidden; }
    body {
      min-height: 100svh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
    }
    .stage {
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(0.25rem, 1.5vh, 0.75rem);
      padding: var(--pad-page);
      text-align: center;
      animation: crt-appear 0.8s ease-out forwards;
      opacity: 0;
    }
    @keyframes crt-appear { to { opacity: 1; } }

    .stage__logo {
      width: clamp(124px, 36vw, 270px);
      height: auto;
      filter:
        drop-shadow(0 0 12px rgba(255,255,255,0.25))
        drop-shadow(0 0 40px rgba(140,160,255,0.15));
      animation: logo-flicker 4s ease-in-out infinite;
    }
    @keyframes logo-flicker {
      0%,8%,50%,55%,100% { opacity: 1;    filter: drop-shadow(0 0 12px rgba(255,255,255,0.25)) drop-shadow(0 0 40px rgba(140,160,255,0.15)); }
      4%                 { opacity: 0.82; filter: drop-shadow(0 0 8px  rgba(255,255,255,0.15)) drop-shadow(0 0 25px rgba(140,160,255,0.10)); }
      5%                 { opacity: 1;    filter: drop-shadow(0 0 14px rgba(255,255,255,0.30)) drop-shadow(0 0 45px rgba(140,160,255,0.18)); }
      7%                 { opacity: 0.9;  filter: drop-shadow(0 0 10px rgba(255,255,255,0.20)) drop-shadow(0 0 30px rgba(140,160,255,0.12)); }
      52%                { opacity: 0.88; filter: drop-shadow(0 0 6px  rgba(255,255,255,0.12)) drop-shadow(0 0 20px rgba(140,160,255,0.08)); }
      53%                { opacity: 1;    filter: drop-shadow(0 0 16px rgba(255,255,255,0.32)) drop-shadow(0 0 50px rgba(140,160,255,0.20)); }
    }

    .stage__nav {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: clamp(1.25rem, 5vw, 2.5rem);
    }

    @media (prefers-reduced-motion: reduce) {
      .stage__logo { animation: none; }
      .stage { opacity: 1; animation: none; }
    }
  </style>
</head>
<body>
  <div class="crt-overlay crt-overlay--scanlines" aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--flicker"   aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--vignette"  aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--glow"      aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--curve"     aria-hidden="true"></div>

  <main class="stage">
    <img class="stage__logo" src="/assets/logo-transparent.png" alt="Monobloc" width="900" height="540">
    <nav class="stage__nav" aria-label="Primary">
      <a class="btn-ghost btn-ghost--lg" href="/live/">Live</a>
      <a class="btn-ghost btn-ghost--lg" href="/media/">Media</a>
      <a class="btn-ghost btn-ghost--lg" href="/shop/">Shop</a>
      <a class="btn-ghost btn-ghost--lg" href="/demos/">Demos</a>
    </nav>
  </main>
  <script src="/assets/keynav.js?v=44" defer></script>
</body>
</html>
