<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Client-side gate: only reachable after entering the password on the Demos link.
       (Static site — this is light protection, not real security.) -->
  <script>
    if (sessionStorage.getItem('demosUnlocked') !== '1') {
      window.location.replace('/');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demos — Monobloc</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Monobloc demos — password protected.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/styles.css?v=45">
</head>
<body class="page-demos">
  <div class="crt-overlay crt-overlay--scanlines" aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--flicker"   aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--vignette"  aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--glow"      aria-hidden="true"></div>
  <div class="crt-overlay crt-overlay--curve"     aria-hidden="true"></div>

  <header class="navbar" role="banner">
    <a class="navbar__logo" href="/" aria-label="Monobloc home">
      <img src="/assets/logo-nav.png" alt="Monobloc" width="699" height="200">
    </a>
    <nav class="navbar__links" aria-label="Primary">
      <a class="btn-ghost" href="/live/">Live</a>
      <a class="btn-ghost" href="/media/">Media</a>
      <a class="btn-ghost" href="/shop/">Shop</a>
      <a class="btn-ghost" href="/demos/" aria-current="page">Demos</a>
    </nav>
  </header>

  <main>
    <div class="demos">
      <!-- Tracklist (left) — buttons are generated by demos.js from window.DEMOS -->
      <nav class="demos__list" id="demoList" aria-label="Demo tracklist"></nav>

      <!-- Viewer (right) -->
      <div class="demos__viewer">
        <div class="demos__video" id="demoVideo">
          <div class="demos__placeholder">loading..</div>
        </div>

        <!-- Song: VFD spectrum player (shown only if the track has audio). -->
        <div class="demos__audio" id="demoAudio" hidden>
          <div class="vfd" id="vfd">
            <div class="vfd__screen-wrap">
              <canvas class="vfd__screen" id="vfdScreen" aria-hidden="true"></canvas>
            </div>
            <div class="vfd__controls">
              <button type="button" class="vfd__play" id="vfdPlay" aria-label="Play">
                <span class="vfd__play-icon" aria-hidden="true"></span>
              </button>
              <span class="vfd__time" id="vfdCur">0:00</span>
              <div class="vfd__seek" id="vfdSeek" role="slider" tabindex="0"
                   aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="vfd__seek-track"><div class="vfd__seek-fill" id="vfdFill"></div></div>
                <div class="vfd__seek-head" id="vfdHead"></div>
              </div>
              <span class="vfd__time" id="vfdDur">0:00</span>
              <a class="vfd__dl" id="demoAudioDl" download>download</a>
            </div>
          </div>
          <audio id="demoAudioEl" crossorigin="anonymous" preload="metadata"></audio>
        </div>

        <h2 class="demos__title" id="demoTitle"></h2>
        <p class="demos__desc" id="demoDesc"></p>

        <!-- Anonymous guest notes (per track). Auto-published; slurs are rejected server-side. -->
        <section class="demos__notes" aria-label="Guest notes">
          <h3 class="demos__notes-head">leave a note</h3>
          <ul class="notes-list" id="notesList"></ul>
          <form class="notes-form" id="notesForm">
            <textarea class="notes-form__input" id="notesInput" rows="2" maxlength="500"
              placeholder="leave an anonymous note.." aria-label="Leave an anonymous note"></textarea>
            <div class="notes-form__row">
              <button type="submit" class="notes-form__send">send</button>
            </div>
            <p class="notes-status" id="notesStatus" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <!--
    ===========================================================================
    DEMOS CONTENT — FALLBACK ONLY
    ===========================================================================
    Real tracks are managed in /admin/ (stored in Redis, videos in Vercel Blob).
    This inline list is shown ONLY if the CMS/API is unreachable. Fields:
      • title       (required) — track name shown in the list + viewer
      • description  — blurb shown under the video
      • src          — direct URL to a self-hosted video file
      • audio        — direct URL to a song file (mp4/wav/mp3) → audio player + download
      • poster       — optional poster image for the <video>
    Leave src out to show a "video coming soon.." placeholder.
    Order here = order in the tracklist. Deep-link a track with #N (1-based).
    -->
  <script>
    window.DEMOS = [
      { title: 'Track One',   description: 'video coming soon..' },
      { title: 'Track Two',   description: 'video coming soon..' },
      { title: 'Track Three', description: 'video coming soon..' },
      { title: 'Track Four',  description: 'video coming soon..' }
    ];
  </script>

  <script src="/assets/keynav.js?v=44" defer></script>
  <script src="/assets/demos.js?v=44" defer></script>
  <script src="/assets/vfd.js?v=45" defer></script>
</body>
</html>
